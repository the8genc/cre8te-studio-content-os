# Cre8te Studio Content OS — Daily Automated Pipeline
# All API keys injected from GitHub Secrets — never stored in code or env files.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
# Add one secret per key in .env.example (use the same variable names).

name: Daily Content Pipeline

on:
  schedule:
    - cron: '0 3 * * *'   # 3am UTC — Testing Agent daily health check
    - cron: '0 4 * * 0'   # Sun 4am UTC — Testing Agent weekly regression
    - cron: '0 5 * * *'   # 5am UTC — Research Scout
    - cron: '0 6 * * *'   # 6am UTC — Ingester
    - cron: '0 7 * * *'   # 7am UTC — Transcriber
    - cron: '0 9 * * *'   # 9am UTC — Content Strategist
    - cron: '0 14 * * *'  # 2pm UTC — Content Writer
    - cron: '0 20 * * 4'  # Thu 8pm UTC — Newsletter Editor
    - cron: '0 8,12,17 * * *' # 3x daily — Publisher
    - cron: '0 9 * * 1'   # Mon 9am UTC — Analyst
    - cron: '0 6 * * 0'   # Sun 6am UTC — Research Scout deep scan
  workflow_dispatch:       # Allow manual trigger from GitHub UI
    inputs:
      agent:
        description: 'Agent to run (scout|ingester|transcriber|strategist|writer|newsletter|publisher|analyst|pipeline)'
        required: true
        default:  'pipeline'
      mode:
        description: 'Mode for research scout (daily|deep)'
        required: false
        default:  'daily'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        # Secrets injected as environment variables — never touch disk or logs
        env:
          CODA_API_KEY:                    ${{ secrets.CODA_API_KEY }}
          CODA_DOC_ID:                     ${{ secrets.CODA_DOC_ID }}
          ANTHROPIC_API_KEY:               ${{ secrets.ANTHROPIC_API_KEY }}
          FIREFLIES_API_KEY:               ${{ secrets.FIREFLIES_API_KEY }}
          FIREFLIES_GRAPHQL_ENDPOINT:      ${{ secrets.FIREFLIES_GRAPHQL_ENDPOINT }}
          APIFY_API_KEY:                   ${{ secrets.APIFY_API_KEY }}
          PERPLEXITY_API_KEY:              ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_DRIVE_CREDENTIALS_JSON:   ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_SUMMIT_FOLDER_ID:   ${{ secrets.GOOGLE_DRIVE_SUMMIT_FOLDER_ID }}
          GOOGLE_DRIVE_MINIPOD_FOLDER_ID:  ${{ secrets.GOOGLE_DRIVE_MINIPOD_FOLDER_ID }}
          GOOGLE_DRIVE_TESTIMONIAL_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_TESTIMONIAL_FOLDER_ID }}
          GOOGLE_DRIVE_ITL_FOLDER_ID:      ${{ secrets.GOOGLE_DRIVE_ITL_FOLDER_ID }}
          POSTIZ_API_KEY:                  ${{ secrets.POSTIZ_API_KEY }}
          KIT_API_KEY:                     ${{ secrets.KIT_API_KEY }}
          INPUT_AGENT:                     ${{ github.event.inputs.agent || 'pipeline' }}
          REPORT_EMAIL:                    ${{ secrets.REPORT_EMAIL }}
          AGENT_EMAIL:                     ${{ secrets.AGENT_EMAIL }}
          SENDGRID_API_KEY:                ${{ secrets.SENDGRID_API_KEY }}
          CODA_TEST_RESULTS_TABLE_ID:      grid-hyU-mpiIb8
          INPUT_MODE:                      ${{ github.event.inputs.mode || 'daily' }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_DOW=$(date -u +%u)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run $INPUT_AGENT ${INPUT_MODE:+-- --$INPUT_MODE}
          elif [ "$CURRENT_HOUR" = "03" ] && [ "$CURRENT_DOW" = "7" ]; then
            npm run test:agent:weekly
          elif [ "$CURRENT_HOUR" = "03" ]; then
            npm run test:agent
          elif [ "$CURRENT_HOUR" = "04" ] && [ "$CURRENT_DOW" = "7" ]; then
            npm run test:agent:weekly
          elif [ "$CURRENT_HOUR" = "05" ] && [ "$CURRENT_DOW" != "7" ]; then
            npm run scout
          elif [ "$CURRENT_HOUR" = "06" ] && [ "$CURRENT_DOW" = "7" ]; then
            npm run scout -- --deep
          elif [ "$CURRENT_HOUR" = "06" ]; then
            npm run ingester
          elif [ "$CURRENT_HOUR" = "07" ]; then
            npm run transcriber
          elif [ "$CURRENT_HOUR" = "09" ] && [ "$CURRENT_DOW" = "1" ]; then
            npm run analyst
          elif [ "$CURRENT_HOUR" = "09" ]; then
            npm run strategist
          elif [ "$CURRENT_HOUR" = "14" ]; then
            npm run writer
          elif [ "$CURRENT_HOUR" = "20" ] && [ "$CURRENT_DOW" = "4" ]; then
            npm run newsletter
          else
            npm run publisher
          fi
